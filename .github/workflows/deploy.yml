name: Deploy homepage

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "_scripts/check-website.py"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "_scripts/check-website.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pages, local links, and assets
        run: python3 _scripts/check-website.py
      - name: Check JavaScript syntax
        run: node --check website/script.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish static homepage to the existing Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: website
          # Retain old blog/news URLs and assets when replacing the homepage.
          clean: false
          force: false
